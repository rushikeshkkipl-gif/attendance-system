<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }
    h1 { font-size: 2rem; margin-bottom: 0.3rem; }
    p.sub { color: #94a3b8; margin-bottom: 2rem; font-size: 1rem; }
    #qr-box {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(99,102,241,0.4);
    }
    #qr-box img { display: block; width: 260px; height: 260px; }
    .date-badge {
      margin-top: 1.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.5rem 1.5rem;
      border-radius: 999px;
      font-size: 0.95rem;
      color: #818cf8;
    }
    .footer {
      margin-top: 2rem;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>📋 Mark Attendance</h1>
  <p class="sub">Scan the QR code with your phone</p>

  <div id="qr-box">
    <img id="qr-img" src="" alt="QR Code loading..." />
  </div>

  <div class="date-badge" id="date-label"></div>
  <p class="footer">QR refreshes every 60 seconds</p>

  <script>
    // ✅ REPLACE THIS with your GitHub Pages URL of attend.html
    const ATTEND_URL = "https://rushikeshkkipl-gif.github.io/attendance-system/attend.html";

    function updateQR() {
      const url = encodeURIComponent(ATTEND_URL);
      document.getElementById("qr-img").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + url;

      const now = new Date();
      document.getElementById("date-label").textContent =
        now.toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }

    updateQR();
    setInterval(updateQR, 60000);
  </script>
</body>
</html>
